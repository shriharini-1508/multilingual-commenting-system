services:
  - type: web
    name: multilingual-commenting-system
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGO_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
